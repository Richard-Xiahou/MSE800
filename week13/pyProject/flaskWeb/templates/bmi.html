<html>
  <head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></link>
  </head>
  <body>
    <div class="container">
      <h1>{{ title }}</h1>
      <form method="POST" action="/calculate_bmi">
        <div class="form-group">
          <label for="weight">Weight (kg):</label>
          <input type="number" class="form-control" id="weight" name="weight" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="height">Height (m):</label>
          <input type="number" class="form-control" id="height" name="height" step="0.01" required>
        </div>
        <button type="submit" class="btn btn-primary">Calculate BMI</button>
      </form>
    </div>
  </body>
</html>
